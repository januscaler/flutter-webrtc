group 'com.cloudwebrtc.webrtc'
version '1.0-SNAPSHOT'

buildscript {
    // compilerOptions {} below needs KGP 2.0+.
    ext.kotlin_version = '2.3.21'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.1.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

// No kotlin-android: AGP 9 compiles Kotlin itself, and while an app still sets
// android.builtInKotlin=false, Flutter (3.44+) applies KGP to plugins that
// don't. Flutter decides by searching this file's text, so don't re-add it,
// even behind a condition.
apply plugin: 'com.android.library'

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.cloudwebrtc.webrtc'
    }
    compileSdkVersion 36

    defaultConfig {
        minSdkVersion 21
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        consumerProguardFiles 'proguard-rules.pro'
    }

    lintOptions {
        disable 'InvalidPackage'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // The one Kotlin file lives under src/main/java. When KGP is applied by
    // Flutter rather than here, that directory isn't a Kotlin source root, so
    // declare it; this also covers AGP's built-in Kotlin.
    sourceSets {
        main.kotlin.srcDirs += 'src/main/java'
    }

}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
    }
}

dependencies {
    implementation 'io.github.webrtc-sdk:android:144.7559.01'
    implementation 'com.github.davidliu:audioswitch:89582c47c9a04c62f90aa5e57251af4800a62c9a'
    implementation 'androidx.annotation:annotation:1.1.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
}
